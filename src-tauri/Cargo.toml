[package]
name = "easy-email"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Easy Email - a lightweight Windows desktop mail client"

[lib]
name = "easy_email_lib"
# `rlib` only. A Tauri template ships `staticlib`/`cdylib` to support mobile targets, but this is
# a Windows-desktop-only app: the extra crate types make MSVC emit an import library, and the
# linker's chatter about it surfaces as a `linker_messages` warning on every build.
crate-type = ["rlib"]

[dependencies]
mail-core = { path = "../crates/mail-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.1", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-dialog = "2.8.1"
# In-app updates. Signature verification **cannot be turned off** (official docs), which is the
# property that makes an update chain trustworthy without an Authenticode certificate: the update
# bundle is signed with a minisign key whose public half lives in the config, and the private half
# lives only in the CI secrets. That is also why this dependency arrives together with
# `bundle.createUpdaterArtifacts` and the key — without the private key at build time the bundler
# refuses to produce the `.sig` files, so a config without a key turns every tagged build red.
#
# Note the dependency's own `reqwest` is 0.13 while this crate uses 0.12: Cargo keeps both, so the
# binary carries two HTTP stacks. That is the cost of not reimplementing minisign verification.
#
# Requires rustc ≥ 1.90 (plugin's own floor); the toolchain here is 1.98/1.99 and CI uses stable.
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
