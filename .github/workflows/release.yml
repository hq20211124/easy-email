name: release

# 打 tag（v*）时构建安装包并挂到 GitHub Release：
#   Windows  -> NSIS setup exe
#   Linux    -> deb / AppImage / rpm
# 产物附带 SHA256SUMS；deb/rpm 的运行时依赖见 src-tauri/tauri.linux.conf.json。
#
# 本文件未能入库：gh 的 token 缺 `workflow` scope。
# 恢复方法（任选）：
#   gh auth refresh -s workflow   # 浏览器授权后
#   git add .github/workflows/release.yml && git commit && git push
# 或在 GitHub 网页直接 Add file -> Create new file，路径填 .github/workflows/release.yml。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "stable"
          target: x86_64-unknown-linux-gnu
      # Fails *here*, with a sentence, rather than three steps later inside the bundler. Without the
      # private key `createUpdaterArtifacts` makes the build fail with a message about signing, and
      # the obvious reading of that is "the config is wrong" rather than "the secret is missing".
      - name: signing key present and shaped like a private key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$TAURI_SIGNING_PRIVATE_KEY"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Every tag build signs its bundles, so a release cannot be built without it."
            exit 1
          fi
          # A path is not the key: the field takes the file's *content*. This mistake builds fine
          # until the bundler tries to read it.
          if [ -e "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is a path. Paste the file's contents (the long base64 blob), not the path to it."
            exit 1
          fi
          # The public key decodes to readable text that says so. Pasting it here is the easiest
          # mistake to make — the two files sit next to each other — and it fails deep inside the
          # bundler with a message about signing, which reads like "the config is wrong".
          if printf '%s' "$KEY" | base64 -d 2>/dev/null | grep -q 'minisign public key'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY holds the PUBLIC key. The private one is ~/.tauri/easy-email.key (the .pub next to it is what the app uses to verify)."
            exit 1
          fi
          # The private key is a base64 blob of a few hundred bytes; anything much shorter is a
          # truncated paste.
          if [ ${#KEY} -lt 200 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY looks truncated (${#KEY} characters). Copy the whole file."
            exit 1
          fi
          echo "private key present and shaped like one"
      - name: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo install tauri-cli --version "^2" && cargo tauri build
      - name: checksums
        run: |
          cd target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0 \
            | xargs -0 sha256sum | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
      # The updater manifest: one entry per bundle type, because the plugin looks its target up as
      # `linux-x86_64-<bundle>` (see `tauri_plugin_updater::Installer`). `latest` in the endpoint
      # resolves to the newest published release, so the file is the single source of truth the
      # installed app asks.
      - name: platform snippet for the manifest
        # `github.ref_name` is the tag itself (`v0.1.2`). The runner's `GITHUB_REF` is the long form
        # (`refs/tags/v0.1.2`) and there is no `GITHUB_REF_NAME` variable, so both of the obvious
        # spellings produce a version string nobody asked for.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release/bundle
          VERSION="${TAG#v}"
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          python3 - "$VERSION" "$REPO" <<'PY'
          import json, sys, pathlib
          from urllib.parse import quote
          version, repo = sys.argv[1], sys.argv[2]
          # Each bundle type gets its own subdirectory under bundle/. The bundles are NOT flat:
          # `deb/*.deb`, `rpm/*.rpm`, `appimage/*.AppImage` — globbing `*.deb` from here finds
          # nothing, which is exactly how the first tagged run of this workflow failed.
          root = pathlib.Path('.')
          wanted = {
              'deb': ('deb', 'deb/*.deb'),
              'rpm': ('rpm', 'rpm/*.rpm'),
              'appimage': ('appimage', 'appimage/*.AppImage'),
          }
          platforms = {}
          for bundle, pattern in wanted.values():
              artifact = next(root.glob(pattern), None)
              if artifact is None:
                  print(f"missing {pattern} — the bundle was not produced")
                  sys.exit(1)
              signature = pathlib.Path(str(artifact) + '.sig')
              if not signature.exists():
                  print(f"missing {signature} — the bundle was not signed (was TAURI_SIGNING_PRIVATE_KEY set?)")
                  sys.exit(1)
              # The Linux bundle names contain spaces ("Easy Email_0.1.2_amd64.deb"), and a URL with
              # a literal space is not a URL: the updater would fail to download it.
              platforms[f"linux-x86_64-{bundle}"] = {
                  "url": f"{repo}/releases/download/v{version}/{quote(artifact.name)}",
                  "signature": signature.read_text().strip(),
              }
          json.dump(platforms, open('platforms-linux.json', 'w'), indent=2)
          print(json.dumps(platforms, indent=2))
          PY
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/deb/*.sig
            target/release/bundle/rpm/*.sig
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/platforms-linux.json
            target/release/bundle/SHA256SUMS

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "stable"
          target: x86_64-pc-windows-msvc
      - name: signing key present and shaped like a private key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="$TAURI_SIGNING_PRIVATE_KEY"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Every tag build signs its bundles, so a release cannot be built without it."
            exit 1
          fi
          if [ -e "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is a path. Paste the file's contents (the long base64 blob), not the path to it."
            exit 1
          fi
          if printf '%s' "$KEY" | base64 -d 2>/dev/null | grep -q 'minisign public key'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY holds the PUBLIC key. The private one is ~/.tauri/easy-email.key (the .pub next to it is what the app uses to verify)."
            exit 1
          fi
          if [ ${#KEY} -lt 200 ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY looks truncated (${#KEY} characters). Copy the whole file."
            exit 1
          fi
          echo "private key present and shaped like one"
      - name: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo install tauri-cli --version "^2" && cargo tauri build
      - name: checksums
        run: |
          cd target/release/bundle/nsis
          Get-FileHash *.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding utf8 SHA256SUMS
          Get-Content SHA256SUMS
      - name: platform snippet for the manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release/bundle/nsis
          VERSION="${TAG#v}"
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          python3 - "$VERSION" "$REPO" <<'PY'
          import json, sys, pathlib
          from urllib.parse import quote
          version, repo = sys.argv[1], sys.argv[2]
          artifact = next(pathlib.Path('.').glob('*setup.exe'), None)
          if artifact is None:
              print("missing the NSIS installer — the bundle was not produced")
              sys.exit(1)
          signature = pathlib.Path(str(artifact) + '.sig')
          if not signature.exists():
              print(f"missing {signature} — the bundle was not signed (was TAURI_SIGNING_PRIVATE_KEY set?)")
              sys.exit(1)
          json.dump(
              {"windows-x86_64": {
                  # `quote` for the same reason as the Linux job: the day the product name gains a
                  # space, an unencoded URL stops being a URL.
                  "url": f"{repo}/releases/download/v{version}/{quote(artifact.name)}",
                  "signature": signature.read_text().strip(),
              }},
              open('platforms-windows.json', 'w'), indent=2,
          )
          print(open('platforms-windows.json').read())
          PY
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*setup.exe
            target/release/bundle/nsis/*setup.exe.sig
            target/release/bundle/nsis/platforms-windows.json
            target/release/bundle/nsis/SHA256SUMS

  # The updater manifest is ONE file covering every platform, and the two build jobs run in
  # parallel — so each of them publishes a snippet under its own asset name and this job is the only
  # writer of `latest.json`. Two jobs writing the same asset would mean "last upload wins", and the
  # manifest the installed apps read would then cover whichever platform happened to finish last.
  # `tauri-plugin-updater` validates the whole file before it even looks at the version, so a
  # manifest with one platform in it is not a partially-working update: it is a broken one.
  manifest:
    runs-on: ubuntu-22.04
    needs: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - name: assemble latest.json from both snippets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::could not read the tag name (got '$TAG'); the manifest version would be wrong"
            exit 1
          fi
          mkdir -p out
          for snippet in platforms-linux.json platforms-windows.json; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$snippet" --clobber --dir out
          done
          # Every platform the app ships in must be present. A missing entry is not "that platform
          # stays on the old version" — the plugin treats an incomplete manifest as unusable, so the
          # whole update chain would break for everyone.
          python3 - "$VERSION" <<'PY'
          import json, sys, datetime, pathlib
          version = sys.argv[1]
          platforms = {}
          for name in ("platforms-linux.json", "platforms-windows.json"):
              path = pathlib.Path("out") / name
              if not path.exists():
                  sys.exit(f"{name} was not uploaded by its build job")
              platforms.update(json.loads(path.read_text()))
          expected = {
              "linux-x86_64-deb",
              "linux-x86_64-rpm",
              "linux-x86_64-appimage",
              "windows-x86_64",
          }
          missing = expected - set(platforms)
          if missing:
              sys.exit(f"the manifest would be incomplete: {sorted(missing)}")
          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          (pathlib.Path("out") / "latest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2)[:400])
          PY
      - name: publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag again: each step gets its own environment, so a variable set in the previous
          # step is not visible here — and an empty `$TAG` would make this upload to no release at all.
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber out/latest.json
