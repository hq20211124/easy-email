[package]
name = "mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol layer for Easy Email: provider presets, IMAP receive, SMTP send"

[dependencies]
# NOTE: both crates default to a non-tokio runtime; Tauri is tokio-based so we must
# opt in explicitly and turn the defaults off.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "native-tls",
    "hostname",
] }
# `full_encoding` pulls in encoding_rs. Without it mail-parser only handles a small charset set
# and legacy GB2312/GBK Chinese mail decodes to mojibake, which is the single most common shape
# of real mail in this market.
mail-parser = { version = "0.11", features = ["full_encoding"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Inline (`cid:`) images are handed to the webview as `data:` URIs, which requires base64.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Attachment identity: a draft records each file's hash when it is added, and the send path compares
# it against the file on disk, so "the file changed under us" is caught instead of sent (design/07
# §5.5). Hashed in chunks — a 100 MB attachment must not be read into memory to hash it.
sha2 = { version = "0.10", default-features = false }
# PKCE verifiers and OAuth `state` values have to come from the OS source: a guessable `state` is a
# real attack (A1-F36), and a guessable verifier defeats the point of PKCE.
getrandom = "0.3"
# DPAPI (`CryptProtectData`) for refresh tokens: the credential manager caps blobs at 2560 bytes and
# Entra refresh tokens are 1-4 KB (A1-F35). User scope only, never LOCAL_MACHINE.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
