[package]
name = "mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol layer for Easy Email: provider presets, IMAP receive, SMTP send"

[dependencies]
# NOTE: both crates default to a non-tokio runtime; Tauri is tokio-based so we must
# opt in explicitly and turn the defaults off.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "native-tls",
    "hostname",
] }
# `full_encoding` pulls in encoding_rs. Without it mail-parser only handles a small charset set
# and legacy GB2312/GBK Chinese mail decodes to mojibake, which is the single most common shape
# of real mail in this market.
mail-parser = { version = "0.11", features = ["full_encoding"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Inline (`cid:`) images are handed to the webview as `data:` URIs, which requires base64.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Attachment identity: a draft records each file's hash when it is added, and the send path compares
# it against the file on disk, so "the file changed under us" is caught instead of sent (design/07
# §5.5). Hashed in chunks — a 100 MB attachment must not be read into memory to hash it.
sha2 = { version = "0.10", default-features = false }
# PKCE verifiers and OAuth `state` values have to come from the OS source: a guessable `state` is a
# real attack (A1-F36), and a guessable verifier defeats the point of PKCE.
getrandom = "0.3"
# DPAPI (`CryptProtectData`) for refresh tokens: the credential manager caps blobs at 2560 bytes and
# Entra refresh tokens are 1-4 KB (A1-F35). User scope only, never LOCAL_MACHINE.
# The OAuth token endpoints are HTTPS POSTs of a form. rustls (not native-tls) because only its
# crate set is available in this environment's offline registry (M1a-38 measured that).
#
# `system-proxy` is **not optional here**, and it is the one feature a `default-features = false`
# build silently loses. Without it reqwest ignores the system proxy entirely — including the
# `HTTPS_PROXY` environment variable — and connects directly. On a machine behind a local proxy
# (measured 2026-10-04: `ProxyEnable=1`, `ProxyServer=127.0.0.1:7897`) the browser reaches Google
# and the app does not, so the consent screen completes and the token exchange times out: the user
# sees "登录完成" in the browser and a failure in the app, which looks like *our* bug because it is.
# Enabling it makes `hyper-util` read the same
# `HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings` the browser obeys.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "system-proxy",
] }
# Needed to set SO_EXCLUSIVEADDRUSE *before* bind: the option cannot be applied to a socket that is
# already listening, and tokio binds for us (A1-F36).
socket2 = "0.6"
# Link classification (`links.rs`): reading a host out of a URL by hand is exactly the kind of parsing
# that gets `https://evil.example\@good.example` wrong. Already in the tree via reqwest, so this adds
# no package — only a direct edge to one that is there.
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Networking_WinSock"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
# The benchmark needs to run the *same* SQL the application runs, including its bound parameters —
# comparing a literal against a parameter is the whole point of `compare_search_paths`, and it is the
# one difference that could explain a 4x gap between the two. Same version as the dependency above,
# so no new package enters the tree.
rusqlite = { version = "0.40.2", features = ["bundled"] }
