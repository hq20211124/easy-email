[workspace]
members = ["crates/mail-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
async-imap = "0.12"
async-native-tls = "0.6"
mail-parser = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
