<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The shell's own CSP. Mail bodies never render in this document: they go into a sandboxed
      iframe with its own stricter policy (see app.js -> buildSandboxedDocument).

      `img-src` has to permit https/http even though this document never renders mail HTML. A
      document loaded via `srcdoc` *inherits* the embedding document's CSP, and the two policies
      intersect. The iframe's own meta policy is what actually gates remote images — `data: blob:`
      by default, plus `https: http:` only after the user opts in for one message — so leaving
      `img-src` narrow here does not add protection, it only makes that per-message opt-in
      impossible: the shell's `img-src 'self' data:` won the intersection and every remote image
      failed to load with `naturalWidth: 0` even after "显示图片" was clicked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>Easy Email</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Must be synchronous and in <head>: it stamps `data-theme` before the first paint. See the
         header comment in theme.js. -->
    <script src="theme.js"></script>
  </head>
  <body>
    <div id="app">
      <!--
        The window's own title bar, drawn here because the native one is off (`decorations: false`).
        Two reason      <!-- ---------------------------------------------------------------- accounts + folders -->
      <aside id="sidebar">
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark"></span>
          <span>Easy Email</span>
          <button id="btn-theme" class="btn ghost icon" title="切换到深色模式" aria-label="切换主题">🌙</button>
        </div>

        <div class="section">
          <div class="section-title">账号</div>
          <div id="account-list" class="account-list"></div>
          <button id="btn-add-account" class="btn ghost block">＋ 添加邮箱账号</button>
        </div>

        <div class="section grow">
          <div class="section-title">文件夹</div>
          <div id="mailbox-list" class="mailbox-list"></div>
        </div>

        <!--
          Drafts are local (`user.db`), not a server folder, so they are listed separately from the
          mailbox tree rather than mixed into it: a "草稿箱" that appears only after the server
          answers would be missing exactly when the network is, which is when drafts matter most.
        -->
        <div class="section">
          <div class="section-title">本地</div>
          <button id="btn-drafts" class="row" type="button">
            <span class="label">草稿箱</span>
            <span id="drafts-count" class="count"></span>
          </button>
          <button id="btn-outbox" class="row" type="button">
            <span class="label">发件箱</span>
            <span id="outbox-count" class="count"></span>
          </button>
          <button id="btn-sync-window" class="row" type="button" title="决定客户端往回取多少邮件">
            <span class="label">同步窗口</span>
            <span id="sync-window-value" class="count"></span>
          </button>
          <!--
            The log, readable. Rotation (8 MB, seven files) only means something to the user if they
            can look at the thing being rotated; otherwise the cap is a promise about a file nobody
            sees.
          -->
          <button id="btn-log" class="row" type="button" title="查看最近的程序日志（最多 500 行，内容已脱敏）">
            <span class="label">查看日志</span>
          </button>
        </div>

        <!--
          Which build this is, and how to get a newer one. The version had no home in the UI at all
          before this: the only place it existed was the installer's filename, which is not something
          a user reporting a bug can be asked to read out.
        -->
        <div class="section">
          <button id="btn-about" class="row" type="button">
            <span class="label">关于</span>
            <span id="about-version" class="count"></span>
          </button>
        </div>

        <button id="btn-compose" class="btn primary block">写邮件</button>
      </aside>

      <!-- ---------------------------------------------------------------- message list -->
      <main id="list-pane">
        <header class="pane-header" data-tauri-drag-region>
          <h1 id="mailbox-title">收件箱</h1>
          <div class="pane-actions">
            <!--
              One switch for the whole app, not one per conversation: the user asked for "选了一个模式就
              全是这个模式". It is a preference, so it is remembered across restarts, and the label says
              which mode is *active* rather than what clicking will do.
            -->
            <button id="btn-view-mode" class="btn ghost" title="切换阅读视图">💬 对话模式</button>
            <button id="btn-refresh" class="btn ghost" title="重新拉取">↻ 刷新</button>
          </div>
        </header>
        <!--
          Says out loud that what is on screen came from the cache, not from the server, and why.
          Without it a stale inbox reads as an up-to-date one, which is the failure this whole cache
          exists to avoid (`design/20-v0.2-plan.md` V2-B). The wording comes from the backend's
          failure kind: "cannot reach the server" and "credential refused" need different remedies.
        -->
        <div id="sync-banner" class="sync-banner" hidden></div>
        <!--
          Search runs entirely against the local cache, so it keeps working offline and never waits
          on the server. The placeholder says so, because "no results" here can mean "not cached
          yet" rather than "not in your mailbox".
        -->
        <div class="search-bar">
          <input
            id="search-input"
            type="search"
            placeholder="搜索已缓存邮件…"
            autocomplete="off"
            spellcheck="false"
            title="多个词是 AND。可按字段限定：from: / to: / subject: / body: / filename:（附件名）。has:attachment 只找带附件的邮件。"
          />
          <button id="btn-search-clear" class="btn ghost" hidden title="退出搜索">✕</button>
        </div>
        <div id="search-status" class="search-status" hidden></div>
        <div id="message-list" class="message-list"></div>
        <div id="list-footer" class="list-footer" hidden>
          <button id="btn-load-more" class="btn ghost block">加载更多</button>
        </div>
      </main>

      <!-- ---------------------------------------------------------------- reader -->
      <section id="reader">
        <!--
          The window controls, where a Windows user reaches for them: the top-right corner. They float
          over the reading pane instead of sitting in a strip of their own, because a full-width strip
          costs a row of height on every screen just to hold three buttons (a real user's suggestion,
          M1a-67). The area to their left is the drag handle for the window — transparent, so nothing
          looks like a title bar, but an undecorated window has to be draggable from somewhere.
        -->
        <div id="reader-drag" data-tauri-drag-region></div>
        <div id="win-controls">
          <button id="win-min" class="winbtn" title="最小化" aria-label="最小化">&#x2013;</button>
          <button id="win-max" class="winbtn" title="最大化 / 还原" aria-label="最大化或还原">&#x25A2;</button>
          <button id="win-close" class="winbtn danger" title="关闭" aria-label="关闭">&#x2715;</button>
        </div>

        <div id="reader-placeholder" class="placeholder">
          <p>选择一封邮件开始阅读</p>
        </div>

        <article id="reader-body" hidden>
          <header class="reader-header">
            <h2 id="reader-subject"></h2>
            <div class="reader-meta">
              <div class="reader-from">
                <span id="reader-from-name"></span>
                <span id="reader-from-addr" class="muted"></span>
              </div>
              <time id="reader-date" class="muted"></time>
            </div>
            <div id="reader-to" class="reader-to muted"></div>
            <div class="reader-toolbar">
              <button id="btn-reply" class="btn ghost">回复</button>
              <button id="btn-forward" class="btn ghost">转发</button>
              <button id="btn-toggle-read" class="btn ghost">标为未读</button>
              <button id="btn-delete" class="btn danger">删除</button>
            </div>
          </header>

          <!--
            The body rendering surface. It is a single element that *moves*: in 单封 view it lives here,
            and in 对话 view it is mounted into the focused bubble. One surface rather than two means one
            sandboxed iframe on screen at a time — which is what keeps "显示图片" from leaking across a
            conversation, and what keeps a 20-message thread from being 20 copies of the renderer.
          -->
          <div id="body-surface">
            <div id="attachment-bar" class="attachment-bar" hidden></div>

            <div class="body-switch">
              <button id="tab-html" class="tab active">HTML</button>
              <button id="tab-text" class="tab">纯文本</button>
              <span class="remote-note">内嵌图片正常显示 · 远程图片默认拦截</span>
            </div>

            <div id="remote-image-bar" class="remote-image-bar" hidden>
              <span id="remote-image-text"></span>
              <button id="btn-show-remote" class="btn ghost">显示图片</button>
            </div>

            <!--
              Links (design/14 §5.3). The body never carries a followable `href` — the sanitiser keeps
              the target as `data-ee-href` — so this bar is how a link is opened at all. It shows the
              real host for every one of them, which is the part a click inside the frame could never
              tell the user.
            -->
            <div id="link-bar" class="link-bar" hidden></div>

            <iframe
              id="body-frame"
              class="body-frame"
              sandbox
              referrerpolicy="no-referrer"
            ></iframe>
            <pre id="body-text" class="body-text" hidden></pre>
          </div>
        </article>

        <!--
          对话模式 (design/08 §2/§5.2): the conversation as bubbles, oldest at the top, the user's own
          messages on the right. Exactly one bubble can be *expanded* and it holds the full body; every
          other bubble shows a text preview, and the whole conversation starts collapsed. That is what
          keeps the security boundary intact — see the note on `#body-surface`: there is one sandboxed
          renderer, so at most one message can be showing rendered HTML at a time.
        -->
        <div id="thread-view" hidden>
          <header class="thread-header">
            <h2 id="thread-subject"></h2>
            <div id="thread-meta" class="muted"></div>
            <div class="reader-toolbar">
              <button id="btn-thread-reply" class="btn ghost">回复</button>
              <button id="btn-thread-forward" class="btn ghost">转发</button>
              <button id="btn-thread-toggle-read" class="btn ghost">标为未读</button>
              <button id="btn-thread-delete" class="btn danger">删除</button>
            </div>
          </header>
          <div id="thread-bubbles" class="thread-bubbles"></div>
          <!--
            Reply without leaving the conversation. Pinned below the bubbles rather than scrolling with
            them, because the moment you want it is the moment you have finished reading. It goes
            through the outbox like every other send, so the undo window applies here too.
          -->
          <div id="thread-reply" class="thread-reply">
            <textarea
              id="thread-reply-text"
              rows="3"
              placeholder="在这里直接回复这个会话…（Ctrl+Enter 发送）"
            ></textarea>
            <div class="thread-reply-foot">
              <span id="thread-reply-target" class="hint"></span>
              <button id="btn-thread-send" class="btn primary">发送</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="modal-root" class="modal-root" hidden></div>
    <div id="toast-root" class="toast-root"></div>

    <!-- Before app.js: it owns the payload shapes app.js sends (see the header of payload.js). -->
    <script src="window.js"></script>
    <script src="payload.js"></script>
    <script src="threads.js"></script>
    <script src="reply.js"></script>
    <script src="history.js"></script>
    <script src="vlist.js"></script>
    <script src="wizard.js"></script>
    <script src="app.js"></script>
  </body>
</html>
